# Нічна копія продакшн-бази D1 (`nasvitlo-trial` у botsDev) — поза Cloudflare. Див. docs/BACKUPS.md.
#
# Time Travel у D1 відкочує базу на будь-яку хвилину за останні 30 днів, але
# живе в тому самому акаунті: видалена база, зламаний акаунт чи помилка, яку
# помітили на 31-й день, — і відкотитися нема куди. Тут SQL-дамп щоночі їде
# в артефакт GitHub Actions і лежить там 90 днів, незалежно від Cloudflare.
#
# Нічого не зламає, поки власник не додав секрети: без них job пише notice і
# завершується зеленим. Копія робиться лише тоді, коли в Settings → Secrets є
# всі три: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID і BACKUP_PASSPHRASE.
#
# Дамп шифрується (gpg, AES-256) паролем із BACKUP_PASSPHRASE, перш ніж стати
# артефактом. Репозиторій публічний, а артефакти публічного репозиторію може
# завантажити будь-хто з акаунтом GitHub; у дампі – чернетки, користувачі,
# passkey і секрети з таблиці options. Без пароля копії немає зовсім:
# незашифрований дамп сюди більше не потрапляє. Розшифрувати:
#   gpg --decrypt nasvitlo-d1-….sql.gz.gpg | gunzip > backup.sql
name: d1-backup
on:
  schedule:
    # 02:17 UTC щодня — ніч за Києвом, не на рівній годині (о :00 черга
    # scheduled-запусків GitHub найдовша, і їх часом пропускають).
    - cron: "17 2 * * *"
  workflow_dispatch:

# Один бекап за раз: ручний запуск посеред нічного не повинен писати той самий
# файл паралельно.
concurrency:
  group: d1-backup
  cancel-in-progress: false

# Job лише читає дерево (щоб узяти wrangler.jsonc і закріплену версію
# wrangler). Артефакт завантажується через ACTIONS_RUNTIME_TOKEN, а не через
# GITHUB_TOKEN, тож писати в репозиторій йому не потрібно — див. ci.yml, чому
# це важливо.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Секрети не можна читати в `if:` напряму, тож окремий крок перетворює
      # «чи задано» на звичайний output. Значення нікуди не виводяться.
      - name: Check secrets
        id: gate
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ] || [ -z "$PASS" ]; then
            echo "::notice title=D1 backup skipped::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / BACKUP_PASSPHRASE не задано в Settings → Secrets and variables → Actions. Див. docs/BACKUPS.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Та сама версія wrangler, що в package-lock.json, а не «найновіша з
      # npx»: формат дампу не зміниться під нами без коміту.
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      # Секрети — лише в env цього кроку: npm ci вище (і будь-яка залежність,
      # що виконує postinstall) токена не бачить.
      - name: Export D1
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Назва бази в botsDev (з 7 жовтня 2026). «trial» лише в назві —
          # це продакшн; див. docs/MOVE-BOTSDEV.md.
          DB: nasvitlo-trial
        run: |
          set -euo pipefail
          # Повний дамп — основний шлях.
          if npx wrangler d1 export "$DB" --remote --output backup.sql --skip-confirmation 2>&1 | tee export.log; then
            mode=full
          elif grep -qi "virtual" export.log; then
            # D1 не експортує віртуальні таблиці. EmDash тримає пошуковий
            # індекс у FTS5 (`_emdash_fts_<колекція>` + службові
            # `_emdash_fts_*_data/_idx/_content/_docsize/_config`), тож якщо
            # повний експорт упав саме на них — експортуємо всі звичайні
            # таблиці поіменно. Індекс відновлюваний: EmDash сам перебудовує
            # відсутню FTS-таблицю (FTSManager.verifyAndRepairAll) — див.
            # docs/BACKUPS.md, «Відновлення».
            echo "::warning::Повний експорт упав на віртуальних таблицях — експортую без пошукового індексу FTS."
            npx wrangler d1 execute "$DB" --remote --json \
              --command "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE '_emdash_fts_%' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name" \
              > tables.json
            mapfile -t tables < <(node -e 'const r=JSON.parse(require("fs").readFileSync("tables.json","utf8"));for(const t of r[0].results)console.log(t.name)')
            args=()
            for t in "${tables[@]}"; do args+=(--table "$t"); done
            npx wrangler d1 export "$DB" --remote --output backup.sql --skip-confirmation "${args[@]}"
            # Тригери, що пишуть у FTS-таблицю, прибираємо з дампу: інакше
            # перший же INSERT у таблицю контенту під час відновлення впаде
            # на відсутній `_emdash_fts_*`. EmDash створить їх заново разом
            # з індексом.
            python3 - <<'PY'
          import re
          sql = open("backup.sql", encoding="utf-8").read()
          sql, n = re.subn(r'CREATE TRIGGER[^;]*?"_emdash_fts_[^"]*"[\s\S]*?\bEND;\s*', "", sql)
          open("backup.sql", "w", encoding="utf-8").write(sql)
          print(f"stripped {n} FTS trigger(s)")
          PY
            # Поіменний експорт не містить індексів і тригерів (370 і 53 на
            # 2026-10-07) – дописуємо їх зі схеми, по команді в рядку;
            # scripts/cf/split-long-inserts.py при відновленні ставить їх
            # після даних.
            npx wrangler d1 execute "$DB" --remote --json \
              --command "SELECT sql FROM sqlite_master WHERE type IN ('index','trigger') AND sql IS NOT NULL AND sql NOT LIKE '%_emdash_fts_%' ORDER BY type, name" \
              > schema.json
            node -e 'for (const r of JSON.parse(require("fs").readFileSync("schema.json","utf8"))[0].results) console.log(r.sql.replace(/\s*\n\s*/g, " ") + ";")' >> backup.sql
            mode=tables-without-fts
          else
            echo "::error::wrangler d1 export не вдався — див. лог вище (найчастіше: у токена немає доступу до D1)."
            exit 1
          fi
          test -s backup.sql
          echo "MODE=$mode" >> "$GITHUB_ENV"

      - name: Compress and encrypt
        if: steps.gate.outputs.enabled == 'true'
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          file="nasvitlo-d1-${stamp}.sql.gz.gpg"
          gzip -9 -c backup.sql | gpg --batch --yes --symmetric --cipher-algo AES256 \
            --pinentry-mode loopback --passphrase-fd 3 -o "$file" 3<<<"$PASS"
          test -s "$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "FILE=$file" >> "$GITHUB_ENV"
          {
            echo "### D1 backup"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Файл | \`$file\` |"
            echo "| Режим | \`$MODE\` |"
            echo "| SQL | $(wc -c < backup.sql) байт, $(grep -c '^INSERT' backup.sql || true) INSERT |"
            echo "| gzip + gpg | $(wc -c < "$file") байт |"
            echo "| SHA-256 | \`$sha\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f backup.sql

      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 90
          if-no-files-found: error
          # Уже gzip і зашифровано — повторне стискання лише гріє раннер.
          compression-level: 0
